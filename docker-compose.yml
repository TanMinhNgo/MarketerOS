name: marketos

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: marketos
      POSTGRES_PASSWORD: marketos_dev
      POSTGRES_DB: marketos
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - marketos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U marketos -d marketos']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.6
    profiles: ['jobs']
    ports:
      - '127.0.0.1:6380:6379'

volumes:
  marketos_postgres:
